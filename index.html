<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>My Weather Model</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1f2a4d, #050814 60%);
            color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(145deg, #151b34, #0e1325);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            padding: 18px 20px;
            border-radius: 14px;
            margin-top: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .hourly-list {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            margin-top: 10px;
            padding-bottom: 6px;
        }

        .hourly-list::-webkit-scrollbar {
            height: 6px;
        }

        .hourly-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 3px;
        }

        .hour-item {
            background: radial-gradient(circle at top left, #27315a, #171d3c);
            border-radius: 10px;
            padding: 8px 10px;
            min-width: 130px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .hour-time {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 2px;
        }

        .hour-temp {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .hour-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        .hour-value {
            font-size: 11px;
            margin-bottom: 2px;
        }

        h1 {
            margin-bottom: 0.3rem;
        }

        h3 {
            margin-top: 0;
        }

        .location-row input {
            background: #101529;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #f5f7ff;
        }

        button {
            background: #3a6df0;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #5a85ff;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .small {
            font-size: 12px;
            opacity: 0.8;
        }

        .error {
            color: #ff6b6b;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My Weather Model</h1>
        <div class="small">Backed by Open‑Meteo + your ML model</div>

        <div class="location-row">
            <input id="name" placeholder="City name" value="Chennai" />
            <input id="lat" placeholder="Lat" value="13.0827" />
            <input id="lon" placeholder="Lon" value="80.2707" />
            <button onclick="loadWeather()">Get Weather</button>
            <span id="status" class="small"></span>
        </div>

        <div id="error" class="error"></div>

        <div id="current" class="card"></div>
        <div class="row">
            <div class="card col" id="today"></div>
            <div class="card col" id="tomorrow"></div>
        </div>

        <div class="card">
            <h3>Hourly today</h3>
            <div id="today-hourly" class="hourly-list"></div>
        </div>

        <div class="card">
            <h3>Hourly tomorrow</h3>
            <div id="tomorrow-hourly" class="hourly-list"></div>
        </div>

        <div class="card" id="air"></div>
    </div>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <canvas id="tempChart" height="120"></canvas>
    <canvas id="rainChart" height="120"></canvas>
    <canvas id="windChart" height="120"></canvas>
    <canvas id="humidityChart" height="120"></canvas>

</body>

</html>
